# 世界书条目：起始之森
key: 起始之森
type: location
priority: 4
content: |
  起始之森是莫恩瑟利亚大陆东南部的一片古老森林。
  树木高大茂密，树干上攀附着青苔和藤蔓。
  林间常有薄雾，阳光透过树冠在地面投下斑驳光影。

  NPC:
  - 老猎人（住在林间小屋，熟悉森林路径）
  - 迷路商人（每周二经过森林小路，售卖补给品）

  敌人:
  - 史莱姆（Lv.1，弱酸性）
  - 野狼（Lv.2，群居）

  可采集:
  - 草药（恢复HP）
  - 蘑菇（可食用/可贩卖）

  出口:
  - 东 → 风车镇（半日路程）
  - 北 → 迷雾沼泽（一日路程）
  - 西 → 遗忘墓穴（半日路程，危险）
