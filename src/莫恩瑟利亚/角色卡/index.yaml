# 头像: 不设置则打包为 JSON
版本: '2.0.0'
作者: 苏渊琳
备注: 莫恩瑟利亚 v2.0 — 开放世界RPG

角色描述: 开放世界RPG同层前端卡 — 莫恩瑟利亚世界

第一条消息:
  - 文件: 第一条消息/0

世界书名称: 莫恩瑟利亚

条目:
  - 名称: 输出格式
    启用: true
    插入位置:
      类型: 角色定义之前
      顺序: 1
    激活概率: 100
    内容: |-
      每次回复必须包含：<thinking> <content> <status> <exits> <options>
      <status>格式: HP:当前/最大| MP:当前/最大| LV:数字 | EXP:当前/下一级| 位置:地名
      <exits>格式: 1. 地名(描述)
      <options>格式: 1. [属性DC] 选项文本 或 1. 纯文本

  - 名称: 世界观
    启用: true
    激活策略:
      类型: 绿灯
      关键字:
        - 莫恩瑟利亚
    插入位置:
      类型: 角色定义之前
      顺序: 50
    激活概率: 100
    内容: |-
      <系统设定>莫恩瑟利亚。六属性STR/DEX/CON/INT/WIS/CHA。等级1-30。D20检定。</系统设定>
